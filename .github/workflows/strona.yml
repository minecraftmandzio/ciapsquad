name: Strona + sociale z Discorda

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"   # co 15 minut sprawdza kanał na Discordzie
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: strona
  cancel-in-progress: false

jobs:
  sociale-i-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Odczytaj kanał Discorda i zaktualizuj sociale
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_KANAL: ${{ vars.DISCORD_KANAL }}
          DISCORD_DOZWOLENI: ${{ vars.DISCORD_DOZWOLENI }}
        run: node .github/scripts/discord-sociale.mjs

      - name: Zapisz zmiany w repo
        id: commit
        run: |
          git config user.name "ciapsquad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dane/
          if git diff --cached --quiet; then
            echo "zmiany=nie" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sociale: aktualizacja z Discorda"
            git push
            echo "zmiany=tak" >> "$GITHUB_OUTPUT"
          fi

      # Strona publikuje się przy każdym pushu i wtedy, gdy bot coś zmienił w socialach
      # (sam commit bota nie odpala publikacji GitHub Pages, dlatego robimy to tutaj).
      - name: Przygotuj stronę
        if: github.event_name != 'schedule' || steps.commit.outputs.zmiany == 'tak'
        uses: actions/configure-pages@v5

      - name: Spakuj stronę
        if: github.event_name != 'schedule' || steps.commit.outputs.zmiany == 'tak'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Opublikuj na GitHub Pages
        id: deploy
        if: github.event_name != 'schedule' || steps.commit.outputs.zmiany == 'tak'
        uses: actions/deploy-pages@v4
